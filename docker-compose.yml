services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servicos_financeiros}
      # Credenciais vêm do arquivo .env (não versionado). O compose falha se não estiverem definidas.
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env (veja .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (veja .env.example)}
    ports:
      # Exposto apenas em localhost, para acesso por ferramentas locais (psql, DBeaver).
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=${POSTGRES_DB:-servicos_financeiros};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      Database__SeedOnStartup: ${SEED_DEMO_DATA:-true}
      Swagger__Enabled: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
