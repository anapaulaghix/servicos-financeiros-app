services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servicos_financeiros}
      # Sem .env, valem senhas padrão de desenvolvimento local: `docker compose up` funciona num clone limpo.
      # O banco e a API só ficam expostos em 127.0.0.1 e o Redis nem é publicado; fora do ambiente
      # local, defina credenciais próprias no .env (veja .env.example).
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_postgres}
    ports:
      # Exposto apenas em localhost, para acesso por ferramentas locais (psql, DBeaver).
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Contadores do rate limiting. Sem porta publicada (só a API o acessa, pela rede interna) e sem
  # persistência em disco: contadores de janela curta não precisam sobreviver a um reinício.
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_only_redis}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      target: runtime
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=${POSTGRES_DB:-servicos_financeiros};Username=${POSTGRES_USER:-app_user};Password=${POSTGRES_PASSWORD:-dev_only_postgres}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:-dev_only_redis}
      Database__MigrateOnStartup: "true"
      Database__SeedOnStartup: ${SEED_DEMO_DATA:-true}
      Swagger__Enabled: "true"
      # Vazio = logs só no console. Com o profile "observability" ativo, aponte para o Elasticsearch.
      Elasticsearch__Url: ${ELASTICSEARCH_URL:-}
      # Único proxy autorizado a informar o IP do cliente (X-Forwarded-For): o nginx do serviço web.
      ReverseProxy__TrustedProxies__0: 172.28.0.10
    ports:
      # Swagger e chamadas diretas só a partir desta máquina; o acesso normal passa pelo web (nginx).
      - "127.0.0.1:8080:8080"

  web:
    build:
      context: ./frontend/servicos-financeiros
      target: runtime
    depends_on:
      - api
    ports:
      - "4200:8080"
    networks:
      default:
        # IP fixo para a API poder confiar só neste proxy (ReverseProxy__TrustedProxies__0).
        ipv4_address: 172.28.0.10

  # --- Testes (profile "test"): rodam em containers, sem .NET, Node ou Chrome na máquina. ---
  #   docker compose --profile test run --rm test-backend
  #   docker compose --profile test run --rm test-frontend
  # Os testes de integração do backend sobem PostgreSQL e Redis com Testcontainers, usando o
  # Docker do host pelo socket montado; os containers criados por eles são descartados ao final.
  test-backend:
    build:
      context: ./backend
      target: test
    profiles: ["test"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  test-frontend:
    build:
      context: ./frontend/servicos-financeiros
      target: test
    profiles: ["test"]

  # --- Observabilidade (opcional): sobe só com o profile "observability" (veja .env.example). ---
  # Segurança do Elasticsearch desligada por ser um ambiente local de demonstração; as portas
  # ficam restritas a 127.0.0.1. Em produção: TLS, usuários e API keys.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.5
    profiles: ["observability"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.5
    profiles: ["observability"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  esdata:
