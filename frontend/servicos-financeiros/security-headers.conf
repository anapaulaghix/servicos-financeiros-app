# Cabeçalhos de segurança, incluídos em cada location do nginx.conf. Ficam num arquivo à parte
# porque um add_header dentro de um location anula todos os add_header herdados do bloco server.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
