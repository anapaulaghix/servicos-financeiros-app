<a class="brand" routerLink="/contas" aria-label="Serviços Financeiros — início">
  <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true">
    <rect width="48" height="48" fill="currentColor" />
    <path d="M24 24 H48 A24 24 0 0 1 24 48 Z" fill="var(--accent)" />
  </svg>
  <span class="brand__name">Serviços<br />Financeiros</span>
</a>

<nav class="nav" aria-label="Navegação principal">
  @for (item of items; track item.path; let i = $index) {
    <a class="nav__link" [routerLink]="item.path" routerLinkActive="is-active">
      <span class="nav__index num">0{{ i + 1 }}</span>
      <span>{{ item.label }}</span>
    </a>
  }
</nav>

<p class="footnote eyebrow">Ambiente de demonstração</p>
