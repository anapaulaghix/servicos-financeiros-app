server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A API fica atrás do mesmo host do front: sem CORS e sem URLs por ambiente.
  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    # O nginx é a borda: o IP do cliente é o da conexão, e não um X-Forwarded-For enviado por ele.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Arquivos com hash no nome nunca mudam: podem ser guardados em cache por muito tempo.
  location ~* \.(?:js|css|woff2?|ico)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Rotas do Angular (SPA): qualquer caminho desconhecido volta para o index.html.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
