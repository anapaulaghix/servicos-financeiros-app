name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um novo push na mesma branch cancela a execução anterior, que ficou obsoleta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET) — build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restaurar dependências
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Os testes de integração sobem PostgreSQL e Redis reais com Testcontainers;
      # o Docker já vem instalado nos runners ubuntu do GitHub.
      - name: Testes (unitários e de integração)
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (Angular) — testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/servicos-financeiros
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/servicos-financeiros/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes (Jasmine + Karma, Chrome headless)
        run: npm run test:ci

      - name: Build de produção
        run: npm run build

  docker:
    name: Docker — build das imagens
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Valores só para o Compose interpolar o arquivo; nada sobe nem é publicado.
      - name: Validar o docker-compose.yml
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          REDIS_PASSWORD: ci
        run: docker compose config --quiet

      - name: Build das imagens da API e do frontend
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          REDIS_PASSWORD: ci
        run: docker compose build api web
